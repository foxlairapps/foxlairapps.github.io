<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoxLair Studio</title>
  <meta name="description" content="FoxLair Studio – nezávislé studio tvořící aplikace a hry.">
  <meta name="theme-color" content="#f7f5ef">
  <style>
    :root{--bg:#f7f5ef;--surface:#fffdf8;--text:#18362f;--muted:#6d7773;--accent:#4f785f;--accent-soft:#eaf1e8;--border:#dfe4de}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
    img{display:block;max-width:100%}a{color:inherit}
    .shell{width:min(960px,calc(100% - 28px));margin:0 auto}
    .page{min-height:100svh;display:flex;flex-direction:column}
    header{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:center;padding:22px 0 12px}
    .studio-logo{width:120px}
    .studio-name{margin:0;font-size:clamp(2rem,6vw,3.5rem);line-height:.95;letter-spacing:-.045em}
    main{flex:1;padding:0 0 24px}
    .project{border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden}
    .project-link{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:center;padding:18px 22px;text-decoration:none;transition:background .18s ease}
    .project-link:hover{background:#fbfcf8}
    .project-link:focus-visible{outline:3px solid rgba(79,120,95,.3);outline-offset:4px}
    .visual{display:grid;place-items:center;min-height:120px;border-radius:16px;background:var(--accent-soft)}
    .visual img{width:82px;border-radius:25%;box-shadow:0 12px 28px rgba(24,54,47,.14)}
    .project-name{margin:0;font-size:clamp(1.85rem,5vw,2.55rem);line-height:1;letter-spacing:-.04em}
    .project-subtitle{margin:6px 0 0;color:var(--accent);font-size:.82rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    .project-copy{margin:12px 0 0;color:var(--muted);max-width:680px}
    .project-more{display:inline-flex;gap:8px;margin-top:12px;color:var(--accent);font-weight:750}
    .project-more::after{content:"→"}
    footer{padding:16px 0 22px;border-top:1px solid var(--border);color:var(--muted);font-size:.88rem}
    .footer-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    footer a{text-decoration:none;color:var(--text)}
    @media(max-width:620px){
      header{grid-template-columns:84px minmax(0,1fr);gap:16px;padding-top:16px;padding-bottom:10px}
      .studio-logo{width:84px}
      .project-link{grid-template-columns:84px minmax(0,1fr);gap:16px;padding:15px 16px}
      .visual{min-height:84px}
      .visual img{width:64px}
      .project-copy{font-size:.94rem}
      .project-more{margin-top:10px}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="shell">
      <img class="studio-logo" src="assets/foxlair-logo.png" alt="Logo FoxLair Studio">
      <div>
        <h1 class="studio-name">FoxLair Studio</h1>
      </div>
    </header>

    <main class="shell">
      <section class="project" aria-labelledby="storywalker-title">
        <a class="project-link" href="https://storywalker.foxlairstudio.com/">
          <div class="visual">
            <img src="assets/storywalker-icon.png" alt="Ikona aplikace StoryWalker">
          </div>
          <div>
            <h2 class="project-name" id="storywalker-title">StoryWalker</h2>
            <p class="project-subtitle">Walking adventures</p>
            <p class="project-copy">Čti, rozhoduj se, plň úkoly a odemykej další části dobrodružství skutečnou chůzí.</p>
            <span class="project-more">Zjistit více</span>
          </div>
        </a>
      </section>
    </main>

    <footer>
      <div class="shell footer-row">
        <span>© 2026 FoxLair Studio</span>
        <a href="mailto:foxlair.apps@gmail.com">foxlair.apps@gmail.com</a>
      </div>
    </footer>
  </div>
</body>
</html>
